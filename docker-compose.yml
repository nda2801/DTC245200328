services:
  student_mysql:
    image: mysql:8.0
    container_name: student_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecurePass2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_db}
      MYSQL_USER: ${MYSQL_USER:-student_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StudentSecurePass2026!}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecurePass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  student_webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: student_webapp
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      student_mysql:
        condition: service_healthy
    environment:
      DB_HOST: student_mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-student_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-StudentSecurePass2026!}
      DB_NAME: ${MYSQL_DATABASE:-student_db}
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
    networks:
      - frontend_net
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: student_phpmyadmin
    restart: unless-stopped
    depends_on:
      student_mysql:
        condition: service_healthy
    environment:
      PMA_HOST: student_mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/pma/
    networks:
      - backend_net

  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    depends_on:
      - student_webapp
      - phpmyadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  mysql_data: