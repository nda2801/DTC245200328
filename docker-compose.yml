services:
  student_mysql:
    image: mysql:8.0
    container_name: student_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootSecurePass2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_db}
      MYSQL_USER: ${MYSQL_USER:-student_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StudentSecurePass2026!}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
      - monitoring_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootSecurePass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  student_webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: student_webapp
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      student_mysql:
        condition: service_healthy
    environment:
      DB_HOST: student_mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-student_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-StudentSecurePass2026!}
      DB_NAME: ${MYSQL_DATABASE:-student_db}
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
    networks:
      - frontend_net
      - backend_net
      - monitoring_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: student_phpmyadmin
    restart: unless-stopped
    depends_on:
      student_mysql:
        condition: service_healthy
    environment:
      PMA_HOST: student_mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/pma/
    networks:
      - backend_net

  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    depends_on:
      - student_webapp
      - phpmyadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net
      - backend_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-AdminSecurePass2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_net

  mysqld_exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld_exporter
    restart: unless-stopped
    depends_on:
      student_mysql:
        condition: service_healthy
    command:
      - '--config.my-cnf=/etc/my.cnf'
    volumes:
      - ./monitoring/mysql/.my.cnf:/etc/my.cnf:ro
    networks:
      - backend_net
      - monitoring_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitoring_net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data: