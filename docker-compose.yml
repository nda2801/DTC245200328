services:
  # =========================================================
  # 1. CƠ SỞ DỮ LIỆU MYSQL 8.0
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: sms-mysql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootAdminSecurePass2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management}
      MYSQL_USER: ${MYSQL_USER:-student_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StudentAppSecurePass2026!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # HARDENING 1: Network Isolation - Không expose port 3306 ra host máy thật
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootAdminSecurePass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================
  # 2. ỨNG DỤNG WEB QUẢN LÝ SINH VIÊN (NODE.JS EXPRESS)
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management}
      # HARDENING 2: Least Privilege - Sử dụng user thường có quyền giới hạn
      MYSQL_USER: ${MYSQL_USER:-student_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StudentAppSecurePass2026!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
      - monitoring-net

  # =========================================================
  # 3. CÔNG CỤ QUẢN TRỊ CSDL PHPMYADMIN
  # =========================================================
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: sms-phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  # =========================================================
  # 4. REVERSE PROXY NGINX (SSL TERMINATION + SECURITY HEADERS)
  # =========================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: sms-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - phpmyadmin
    networks:
      - frontend-net

  # =========================================================
  # 5. GIÁM SÁT HỆ THỐNG VỚI PROMETHEUS (METRICS SERVER)
  # =========================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sms-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring-net

  # =========================================================
  # 6. TRỰC QUAN HÓA METRICS VỚI GRAFANA
  # =========================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sms-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-GrafanaAdminSecure2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net

  # =========================================================
  # 7. EXPORTER METRICS CONTAINERS (CADVISOR)
  # =========================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sms-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring-net

  # =========================================================
  # 8. EXPORTER METRICS CƠ SỞ DỮ LIỆU MYSQL
  # =========================================================
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: sms-mysql-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER:-student_user}:${MYSQL_PASSWORD:-StudentAppSecurePass2026!}@(mysql:3306)/${MYSQL_DATABASE:-student_management}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net
      - monitoring-net

  # =========================================================
  # 9. LƯU TRỮ VÀ TRUY VẤN LOG TẬP TRUNG (GRAFANA LOKI)
  # =========================================================
  loki:
    image: grafana/loki:3.1.1
    container_name: sms-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  # =========================================================
  # 10. THU THẬP LOG TẬP TRUNG (PROMTAIL)
  # =========================================================
  promtail:
    image: grafana/promtail:3.1.1
    container_name: sms-promtail
    restart: unless-stopped
    user: root
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring-net

# =========================================================
# MẠNG VÀ PHÂN VÙNG LƯU TRỮ (ISOLATION NETWORKS & VOLUMES)
# =========================================================
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  mysql_data:
  nginx_logs:
  prometheus_data:
  grafana_data:
  loki_data:
