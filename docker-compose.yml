services:
  # =========================================================
  # 1. CƠ SỞ DỮ LIỆU MYSQL 8.0
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: sms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootAdminSecurePass2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management}
      MYSQL_USER: ${MYSQL_USER:-student_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StudentAppSecurePass2026!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # HARDENING: Không expose port 3306 ra host máy thật, chỉ mở nội bộ
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootAdminSecurePass2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================
  # 2. ỨNG DỤNG WEB QUẢN LÝ SINH VIÊN (NODE.JS EXPRESS)
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management}
      MYSQL_USER: ${MYSQL_USER:-student_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StudentAppSecurePass2026!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  # =========================================================
  # 3. CÔNG CỤ QUẢN TRỊ CSDL PHPMYADMIN
  # =========================================================
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: sms-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  # =========================================================
  # 4. REVERSE PROXY NGINX (SSL TERMINATION + SECURITY HEADERS)
  # =========================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: sms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - phpmyadmin
    networks:
      - frontend-net

# =========================================================
# MẠNG VÀ PHÂN VÙNG LƯU TRỮ (ISOLATION NETWORKS & VOLUMES)
# =========================================================
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  mysql_data:
  nginx_logs:
